version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps: [common:tidy, common:frontend]
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -extldflags=-mmacosx-version-min=12.0" -o {{.BIN_DIR}}/{{.APP_NAME}}
      - python3 build/darwin/package.py {{.BIN_DIR}}/{{.APP_NAME}}
    env:
      GOOS: darwin
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1
      MACOSX_DEPLOYMENT_TARGET: '12.0'
  package:
    cmds:
      - task: build
  run:
    cmds:
      - open '{{.BIN_DIR}}/{{.APP_NAME}}.app'
