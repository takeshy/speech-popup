name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and attach to the draft release
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            arch: amd64
            artifact: speech-popup-linux-amd64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
            artifact: speech-popup-linux-arm64
          - os: macos-14
            target: darwin
            arch: arm64
            artifact: speech-popup-darwin-arm64
          - os: windows-latest
            target: windows
            arch: amd64
            artifact: speech-popup-windows-amd64.exe
          - os: windows-latest
            target: windows
            arch: arm64
            artifact: speech-popup-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a vMAJOR.MINOR.PATCH tag"; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          node -e 'const fs = require("fs"); const version = JSON.parse(fs.readFileSync("wails.json")).info.version; if (`v${version}` !== process.env.RELEASE_TAG) process.exit(1);'

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test
        shell: bash
        run: |
          npm test
          npm run build
          if [ "${{ matrix.target }}" = "linux" ]; then
            go test -tags gtk3 ./...
          elif [ "${{ matrix.target }}" = "darwin" ]; then
            # macOS runner TMPDIR paths exceed the Unix socket path limit in IPC tests.
            TMPDIR=/tmp go test ./...
          else
            go test ./...
          fi

      - name: Build binary
        shell: bash
        env:
          MSIX_PACKAGE_NAME: ${{ vars.MSIX_PACKAGE_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          else
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          fi
          wails3 task ${{ matrix.target }}:build ARCH=${{ matrix.arch }}
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp bin/speech-popup.exe bin/${{ matrix.artifact }}
            if [ -n "$MSIX_PACKAGE_NAME" ] && [ -n "$MSIX_PUBLISHER" ]; then
              wails3 task windows:msix ARCH=${{ matrix.arch }}
            else
              echo "::notice::Store identity is not configured; uploading the EXE without MSIX."
            fi
          else
            cp bin/speech-popup bin/${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/${{ matrix.artifact }}
            bin/speech-popup-windows-*.msix
          if-no-files-found: error

  release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
